# ─────────────────────────────────────────────────────────────────────────────
# Sonaro Gate • 2025.1 LTS  —  Nginx Reverse Proxy (HTTP)
# GitHub: https://github.com/huynhtrungcsc/sonaro-gate
#
# Purpose:  Optional reverse proxy in front of the Sonaro Gate Express server.
#           Place this in /etc/nginx/sites-available/sonaro-gate and enable it:
#
#   sudo ln -s /etc/nginx/sites-available/sonaro-gate /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS with Let's Encrypt, use nginx-ssl.conf instead.
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones — add to /etc/nginx/nginx.conf http block if missing:
#   limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
#   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # ── Security Headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Proxy all requests to Sonaro Gate (Express, port 5000) ─────────────
    # Express serves BOTH the React SPA (from /dist) and all /api/* routes.
    # There is no separate static file server or PostgREST container.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_hide_header X-Powered-By;
    }

    # ── Rate-limit the login endpoint ───────────────────────────────────────
    location /api/rpc/authenticate {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (real-time dashboard metrics) ─────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Deny hidden files ───────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }

    access_log /var/log/nginx/sonaro-gate-access.log combined;
    error_log  /var/log/nginx/sonaro-gate-error.log warn;
}
