# ─────────────────────────────────────────────────────────────────────────────
# Sonaro Gate • 2025.1 LTS  —  Nginx TLS / HTTPS Config
# GitHub: https://github.com/huynhtrungcsc/sonaro-gate
#
# Purpose:  Production HTTPS in front of the Sonaro Gate Express server.
#           Obtains and renews a Let's Encrypt certificate via Certbot.
#
# Setup:
#   1. Install nginx and certbot:
#        sudo apt install -y nginx python3-certbot-nginx
#   2. Obtain certificate:
#        sudo certbot --nginx -d firewall.example.com
#   3. Copy this file:
#        sudo cp deploy/nginx-ssl.conf /etc/nginx/sites-available/sonaro-gate
#        sudo sed -i 's/\${DOMAIN}/firewall.example.com/g' /etc/nginx/sites-available/sonaro-gate
#        sudo ln -sf /etc/nginx/sites-available/sonaro-gate /etc/nginx/sites-enabled/
#   4. Remove the default site and reload:
#        sudo rm -f /etc/nginx/sites-enabled/default
#        sudo nginx -t && sudo systemctl reload nginx
#
# Rate limiting — add to /etc/nginx/nginx.conf http block if missing:
#   limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
#   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN};
    server_tokens off;

    # Let's Encrypt ACME challenge (Certbot renew)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name ${DOMAIN};
    server_tokens off;

    # ── TLS (A+ rating) ─────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:; frame-ancestors 'self';" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Proxy all requests to Sonaro Gate (Express, port 5000) ──────────────
    # Express serves BOTH the React SPA (from /dist) and all /api/* routes.
    # There is no separate static file server or PostgREST container.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_hide_header X-Powered-By;
    }

    # ── Login endpoint with strict rate limit ────────────────────────────────
    location /api/rpc/authenticate {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (real-time dashboard metrics) ──────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Deny hidden files ────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }

    access_log /var/log/nginx/sonaro-gate-access.log combined;
    error_log  /var/log/nginx/sonaro-gate-error.log warn;
}
