# ─────────────────────────────────────────────────────────────────────────────
# Sonaro Gate • 2025.1 LTS  —  Docker Compose
# GitHub: https://github.com/huynhtrungcsc/sonaro-gate
#
# Quick start:
#   cp .env.example .env          # edit JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up -d
#   docker compose logs -f sonaro-gate
#
# Web UI: http://localhost:5000
# Login:  admin@sonaro.local / Admin123!  (change on first login)
#
# ── Network modes ────────────────────────────────────────────────────────────
# Mode A — Production / bare-metal (DEFAULT, active below):
#   Both services use network_mode: host → share host network stack.
#   App reaches PostgreSQL at 127.0.0.1:5432 (same host network).
#   iptables / netplan / sysctl commands affect the REAL host kernel.
#   Use this when the machine IS the firewall.
#
# Mode B — Development / Docker Desktop:
#   Services on a bridge network. iptables applies inside container only.
#   Comment out `network_mode: host` lines and uncomment the bridge config.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sonaro-db
    restart: unless-stopped

    # Mode A: host network — reachable at 127.0.0.1:5432 from the app
    network_mode: host

    # Mode B: bridge — uncomment below, comment out network_mode above
    # networks:
    #   - sonaro-net
    # ports:
    #   - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sonaro_gate}
      POSTGRES_USER:     ${POSTGRES_USER:-sonaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonaro} -d ${POSTGRES_DB:-sonaro_gate}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Sonaro Gate Application ────────────────────────────────────────────────
  sonaro-gate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonaro-gate
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    # Mode A: host network + privileged — full iptables/netplan on real host
    network_mode: host
    privileged: true

    # Mode B: bridge — uncomment below, comment out the two lines above
    # cap_add: [NET_ADMIN, NET_RAW]
    # ports:
    #   - "${PORT:-5000}:5000"
    # networks:
    #   - sonaro-net

    environment:
      NODE_ENV:     production
      PORT:         ${PORT:-5000}
      # Mode A: localhost (both on host network)
      DATABASE_URL: postgresql://${POSTGRES_USER:-sonaro}:${POSTGRES_PASSWORD:-changeme!}@127.0.0.1:5432/${POSTGRES_DB:-sonaro_gate}
      # Mode B bridge: DATABASE_URL: postgresql://sonaro:changeme!@db:5432/sonaro_gate
      JWT_SECRET:   ${JWT_SECRET:-CHANGE-THIS-TO-A-LONG-RANDOM-STRING-IN-PRODUCTION}
      SONARO_SKIP_SETUP: ""   # empty = CLI wizard runs on first interactive start

    volumes:
      # Bind mounts so Sonaro Gate writes to the real host filesystem
      - /etc/netplan:/etc/netplan
      - /etc/sysctl.d:/etc/sysctl.d
      - /etc/iptables:/etc/iptables
      - /etc/suricata:/etc/suricata
      - /var/log/suricata:/var/log/suricata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

volumes:
  pgdata:
    driver: local

# Mode B only:
# networks:
#   sonaro-net:
#     driver: bridge
